<style id="appstyle">:root{--bg:#7fe9dd;--panel:#effffd;--ink:#06302c;--mute:#2f5f5a;--line:#4fc4b8;--acc:#0f766e;--t1:#d4a017;--t2:#8e97a8;--t3:#b8742f;--t4:#3f8f6a;--t5:#5a7bb8;

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

.chip{display:inline-flex;align-items:center;gap:4px}button.chip{border:0;padding:3px 8px;font:700 11px/1.4 "Trebuchet MS",system-ui,sans-serif;cursor:pointer}.ic{vertical-align:-2px;flex:none}

main #stats{margin-top:0;padding:0;background:none;border:0}
.stc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.stc>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stc b{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1.1}.stc span{display:block;font-size:12px;color:var(--mute);margin-top:4px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}.sb{background:var(--bg);border-radius:10px;padding:10px 12px}.sb b{display:block;font-size:24px;line-height:1.2}.sb span{font-size:12px;color:var(--mute)}
.sq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:10px}.sq .sn{margin-left:auto;font-size:15px}.sq .sn b{font-size:22px}

.card .warn{margin-top:14px;padding:12px 14px;border:1px solid #c0392b;border-radius:10px;background:rgba(192,57,43,.14)}.card .warn p{margin:6px 0 12px;font-size:13px;color:var(--ink)}
.cw{position:relative;margin-top:8px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px}

.row{grid-template-columns:36px 44px 1fr auto;cursor:pointer;transition:border-color .15s}.row:hover{border-color:var(--acc)}

  if(!ADM)return;var t=e.target,h=document.getElementById('hist'),name=h?h.dataset.p:'',p=P.filter(function(x){return x.name===name})[0];
  if(!p||!t.dataset)return;
  if(t.dataset.rm)ask('Remove the '+t.dataset.rm+' tier?','This deletes '+name+'\u2019s '+t.dataset.rm+' rating and its whole history. This can\u2019t be undone.','rm',t.dataset.rm);
  else if(t.id==='delp')askDel('warn',name,['ybn','ydl','no']);
  else if(t.id==='ybn'){ban(p,'Banned');banlog(name);closeP();render()}
  else if(t.id==='ydl'){wipe(name);closeP();render()}
  else if(t.id==='no')document.getElementById('warn').innerHTML='';
  else if(t.id==='yes'){
    if(t.dataset.k==='rm'){delete p.t[t.dataset.md];if(p.h)delete p.h[t.dataset.md];touch();render();openProfile(name)}
    else{ban(p,'Deleted');banlog(name);closeP();render()}
  }
});
(function(){
  var f=document.getElementById('add'),w=document.getElementById('fwarn');
  function find(n){return P.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0]}
  function ask2(title,msg,k,n,m){w.innerHTML='<div class="warn" role="alert"><b>\u26a0 '+esc(title)+'</b><p>'+esc(msg)+'</p><button type="button" class="danger" id="fyes" data-k="'+k+'" data-n="'+esc(n)+'" data-md="'+m+'">Yes, delete</button> <button type="button" id="fno">Cancel</button></div>'}
  function info(msg){w.innerHTML='<div class="warn" role="alert"><p>'+esc(msg)+'</p></div>'}
  f.addEventListener('click',function(e){
    if(!ADM)return;var id=e.target.id,n=document.getElementById('fn').value.trim(),m=fm.value,p=n&&find(n);
    if(id==='fdt'||id==='fdp'){
      if(!n)return info('Type the player name first.');
      if(!p)return info('No player called '+n+' found.');
      if(id==='fdt'){
        if(!p.t[m])return info(p.name+' has no '+m+' tier to remove.');
        ask2('Remove '+p.name+'\u2019s '+m+' tier?','This deletes the '+m+' rating and its whole history. The player stays. This can\u2019t be undone.','t',p.name,m);
      }else askDel('fwarn',p.name,['fbn','fdl','fno']);
    }else if(id==='fbn'){var q2=find(e.target.dataset.n);if(q2){ban(q2,'Banned');banlog(q2.name)}w.innerHTML='';f.reset();render()}
    else if(id==='fdl'){wipe(e.target.dataset.n);w.innerHTML='';f.reset();render()}
    else if(id==='fno')w.innerHTML='';
    else if(id==='fyes'){
      var q=find(e.target.dataset.n),md=e.target.dataset.md;
      if(q){if(e.target.dataset.k==='t'){delete q.t[md];if(q.h)delete q.h[md];mode=md;touch()}else{ban(q,'Deleted');banlog(q.name)}}
      w.innerHTML='';f.reset();render();
    }
  });
})();
function wipe(n){if(!ADM)return;var i=P.map(function(x){return x.name}).indexOf(n);if(i>-1)P.splice(i,1);LOG=LOG.filter(function(l){return typeof l==='string'?l.indexOf(n)<0:l.n!==n});touch();drawTicker()}
function askDel(box,name,ids){document.getElementById(box).innerHTML='<div class="warn" role="alert"><b>⚠ Remove '+esc(name)+'?</b><p>All tiers and history are cleared either way. This can’t be undone.</p><p><b>Ban</b> moves them to the Banned tab. <b>Delete only</b> erases the profile so they show up nowhere.</p><button type="button" class="danger" id="'+ids[0]+'" data-n="'+esc(name)+'">Ban player</button> <button type="button" class="danger" id="'+ids[1]+'" data-n="'+esc(name)+'">Delete only</button> <button type="button" id="'+ids[2]+'">Cancel</button></div>'}
function drawTicker(){
  var xb=function(h,i){var en=LOG[i];if(en&&typeof en==='object'&&en.big&&!en.ban)h=h.replace('class="big"','class="big" data-li="'+i+'"');return h.replace(/<\/span>$/,'<button type="button" class="dx" data-dx="'+i+'" aria-label="Remove from ticker" title="Remove from ticker">\u00d7</button></span>')};
  var h='<i class="dot"></i>'+LOG.map(function(l,i){return xb((function(){
    if(typeof l==='string')return '<span>'+esc(l)+'</span>';
    if(l.ban)return '<span class="big" data-pn="'+esc(l.n)+'" title="Open profile">'+av(l.n,24)+'<b>'+esc(l.n)+'</b><span class="chip" style="background:#c0392b">Banned</span><span class="meta">'+esc(l.r)+' ('+l.d+')</span></span>';
    if(!l.big)return '<span>'+esc(l.s+' ('+l.d+')')+'</span>';
    return '<span class="big" data-pn="'+esc(l.n)+'" title="Open profile">'+av(l.n,24)+'<b>'+esc(l.n)+'</b>'+icon(l.m,18)+'<span class="chip '+cls(l.t)+'">'+l.t+'</span><span class="meta">'+l.d+'</span></span>';
  })(),i)}).join('');
  document.getElementById('ticker').innerHTML=LOG.length?h:'<i class="dot"></i><span>Your rating changes will show up here</span>';
}
document.getElementById('ticker').addEventListener('click',function(e){var d=e.target.closest('[data-dx]');if(d){if(!ADM)return;e.stopPropagation();LOG.splice(+d.dataset.dx,1);touch();drawTicker();return}var s=e.target.closest('[data-pn]');if(s){if(s.dataset.li!==undefined)openFight(+s.dataset.li);else openProfile(s.dataset.pn)}});
/* ---- fight history: stored on each tier-history entry, shown in the profile and the live updates board ---- */
var FT=null;
function normScore(s){s=(s||"").trim();if(!s)return "";var m=/^(\d{1,3})\s*[-\u2013:]\s*(\d{1,3})$/.exec(s);return m?m[1]+"-"+m[2]:null}
function fightText(f){var w=[f.tt,f.tl].filter(Boolean).join(", ");return f.r+(f.s?" "+f.s:"")+(w?" ("+w+")":"")}
function fchips(e){return (e&&e.f||[]).map(function(f){return '<span class="fight '+(f.r==="Won"?"won":"lost")+'">'+esc(fightText(f))+'</span>'}).join("")}
function histRows(p,m,L){return '<div>'+L.map(function(e,k){return {e:e,k:k}}).reverse().map(function(o){var e=o.e,ds=' data-hm="'+esc(m)+'" data-hp="'+esc(p.name)+'"';return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px"><span class="chip '+cls(e.t)+'">'+e.t+'</span><span class="meta">'+fd(e.ts)+'</span>'+(e.ev?'<span class="fight won">+Eval</span>':'')+fchips(e)+'<button type="button" class="fx" data-hf="'+o.k+'"'+ds+'>+ Fight</button>'+(canEv(e.t)?'<button type="button" class="fx" data-he="'+o.k+'"'+ds+'>'+(e.ev?'Remove eval':'+ Eval')+'</button>':'')+(canEv(e.t)&&e.ev&&e.ev.x?'<div class="meta" style="width:100%;white-space:pre-wrap">Eval: '+esc(e.ev.x)+(e.ev.by?' ('+esc(e.ev.by)+')':'')+'</div>':'')+'</div>'}).join("")+'</div>'}
function getE(){if(!FT)return null;var p=P.filter(function(x){return x.name===FT.n})[0];if(!p)return null;return hist(p,FT.m)[FT.k]||null}
function entryFor(l){var p=P.filter(function(x){return x.name===l.n})[0];if(!p||!l.m||!p.t[l.m])return null;var L=hist(p,l.m),k=-1,i;for(i=L.length-1;i>=0;i--)if(L[i].t===l.t){k=i;break}return k<0?null:{n:p.name,m:l.m,k:k}}
function openFightFor(n,m,k){FT={n:n,m:m,k:k};drawFight();openM()}
function openFight(i){
  var l=LOG[i];if(!l||typeof l!=="object")return;
  FT=entryFor(l)||{n:l.n,m:l.m,k:-1};
  var e=getE();if(e&&l.f){e.f=(e.f||[]).concat(l.f);delete l.f;touch()}
  drawFight();openM();
}
function drawFight(){
  var e=getE();
  if(!e){card.innerHTML='<h3>Fight history</h3><p class="meta">No tier history found for this rating.</p><p><button type="button" id="fcprof">View profile</button> <button type="button" id="x">Close</button></p>';return}
  var fs=e.f||[];
  card.innerHTML='<h3>Fight history</h3><p class="meta">'+esc(FT.n)+' &middot; '+esc(e.t)+' in '+esc(FT.m)+' &middot; '+fd(e.ts)+'</p>'+
    '<div>'+(fs.length?fs.map(function(f,k){return '<p style="display:flex;align-items:center;gap:8px;margin:8px 0 0"><span class="fight '+(f.r==="Won"?"won":"lost")+'">'+esc(fightText(f))+'</span><button type="button" class="fx" data-ffrm="'+k+'" aria-label="Remove this fight" title="Remove this fight" style="font-size:16px">\u00d7</button></p>'}).join(""):'<p class="meta">No fights added yet.</p>')+'</div>'+
    (ADM?'<p style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><select id="fcr" aria-label="Result"><option>Won</option><option>Lost</option></select><input id="fcs" placeholder="Score, e.g. 5-6" maxlength="7" size="12" aria-label="Score"><input id="fct" placeholder="Tester name" maxlength="16" size="14" aria-label="Tester name"><select id="fcl" aria-label="Tester tier"><option value="">Tester tier</option>'+TIERS.map(function(t){return '<option>'+t+'</option>'}).join("")+'</select><button type="button" id="fcadd">Add fight</button></p><p id="fce" class="meta" style="color:#c0392b" role="alert"></p>':'')+
    '<p><button type="button" id="fcprof">View profile</button> <button type="button" id="x">Close</button></p>';
}
function addFight(){
  var e=getE(),er=document.getElementById("fce");if(!e)return;
  var s=normScore(document.getElementById("fcs").value);
  if(s===null){er.textContent="Score should look like 5-6.";return}
  e.f=e.f||[];e.f.push({r:document.getElementById("fcr").value,s:s,tt:document.getElementById("fct").value.trim(),tl:document.getElementById("fcl").value});
  touch();drawFight();document.getElementById("fcs").focus();
}
function backToProfile(){var n=FT.n,m=FT.m;openProfile(n);var p=P.filter(function(x){return x.name===n})[0];if(p&&p.t[m])showHist(n,m)}
function canEv(t){return t==="LT3"||t==="LT2"||t==="LT1"}
function evOf(p,m){var L=p.h&&p.h[m],i;if(!L)return null;for(i=L.length-1;i>=0;i--)if(L[i].t===p.t[m])return L[i];return null}
function evTag(p,m){var e=canEv(p.t[m])&&evOf(p,m);return e&&e.ev?' +Eval':''}
function toggleEval(n,m,k){FT={n:n,m:m,k:k};var e=getE();if(!e||!canEv(e.t))return;if(e.ev)delete e.ev;else e.ev={ts:Date.now()};touch();backToProfile()}
document.getElementById("add").addEventListener("submit",function(){
  if(!ADM)return;var n=document.getElementById("fn").value.trim(),m=fm.value,t=ft.value;if(!canEv(t)||!n)return;
  setTimeout(function(){var p=P.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0];if(!p||p.t[m]!==t)return;
    document.getElementById("fwarn").innerHTML='<div class="warn" style="border-color:var(--acc);background:none" role="status"><p>'+esc(p.name)+' got '+esc(t)+' in '+esc(m)+'.</p><button type="button" id="fev" data-n="'+esc(p.name)+'" data-m="'+esc(m)+'" data-t="'+t+'">+ Eval</button> <button type="button" id="fevno">Not now</button></div>'},0);
},true);
document.getElementById("fwarn").addEventListener("click",function(e){var id=e.target.id;if(id==="fevno"){this.innerHTML="";return}if(id==="fev"&&ADM){var n=e.target.dataset.n,ee=entryFor({n:n,m:e.target.dataset.m,t:e.target.dataset.t});if(ee){FT=ee;var en=getE();if(en){en.ev={ts:Date.now()};touch()}}this.innerHTML='<div class="warn" style="border-color:var(--acc);background:none" role="status"><p>+Eval given to '+esc(n)+'.</p></div>'}});
card.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.id==="fcprof"&&FT){var n=FT.n,m=FT.m;openProfile(n);var p=P.filter(function(x){return x.name===n})[0];if(p&&p.t[m])showHist(n,m);return}
  var he=t.closest&&t.closest("[data-he]");
  if(he){if(ADM)toggleEval(he.dataset.hp,he.dataset.hm,+he.dataset.he);return}
  var hf=t.closest&&t.closest("[data-hf]");
  if(hf){if(ADM)openFightFor(hf.dataset.hp,hf.dataset.hm,+hf.dataset.hf);return}
  if(!ADM||!FT)return;
  if(t.id==="fcadd")addFight();
  else if(t.dataset&&t.dataset.ffrm!==undefined){var e=getE();if(e&&e.f){e.f.splice(+t.dataset.ffrm,1);if(!e.f.length)delete e.f;touch();drawFight()}}
});
card.addEventListener("keydown",function(e){if(e.key==="Enter"&&ADM&&FT&&(e.target.id==="fcs"||e.target.id==="fct")){e.preventDefault();addFight()}});
var BAN=[];
function nowd(){return new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'})}
function ban(p,r){var i=P.indexOf(p);if(i>-1)P.splice(i,1);p.t={};p.h={};p.ban={r:r,d:nowd()};BAN.unshift(p);touch()}
function sd(){return new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})}
function openBanned(p){
  card.innerHTML='<div class="top">'+av(p.name,96)+'<div><h3>'+esc(p.name)+'</h3><div class="meta">Banned player</div></div></div><div class="chips"><span class="chip" style="background:#c0392b;font-size:16px;padding:8px 14px">Banned</span></div><p>'+esc(p.ban.r)+' &middot; '+p.ban.d+'. Saving a new rating for this player in the form unbans them.</p><p><button id="x">Close</button></p>';
  openM();
}
function banlog(n){LOG.unshift({ban:true,big:true,n:n,r:'Deleted',d:sd()});LOG=LOG.slice(0,6);drawTicker()}
function bannedView(f){
  var L=BAN.filter(function(p){return !f||p.name.toLowerCase().indexOf(f)>-1}),h='<p class="meta">Players with 0 points or who were deleted end up here. Saving a new rating for one unbans them.</p>';
  if(!L.length)return h+'<p class="empty">Nobody is banned.</p>';
  return h+L.map(function(p){return '<div class="row" style="cursor:default"><div class="rank" style="color:#c0392b">&times;</div>'+av(p.name,44)+'<div><div class="name">'+esc(p.name)+' <span class="meta">'+p.region+'</span></div><div class="meta">Banned '+p.ban.d+' &middot; '+esc(p.ban.r)+'</div></div><div class="pts"></div></div>'}).join('');
}
var RANKS=[{n:'Nováček',min:1,r:'1–19',c:'#7d8594',t:'#fff'},{n:'Strážce',min:20,r:'20–49',c:'#3f8f6a',t:'#fff'},{n:'Bojovník',min:50,r:'50–99',c:'#3b73c4',t:'#fff'},{n:'Combat Cadet',min:100,r:'100–199',c:'#7d4fc4',t:'#fff'},{n:'Combat Master',min:200,r:'200–299',c:'#d9742a',t:'#fff'},{n:'Combat Grandmaster',min:300,r:'300+',c:'#f7cf4f',t:'#2a2200'}];
function rk(p){var s=pts(p),r=null;RANKS.forEach(function(x){if(s>=x.min)r=x});return r}
function rkb(p){var r=rk(p);return r?'<span class="rk" style="background:'+r.c+';color:'+r.t+'">'+r.n+'</span>':''}
function drawRanks(){document.getElementById('rankbar').innerHTML='<small class="meta">Ranks by points</small>'+RANKS.map(function(r){return '<span class="rk" style="background:'+r.c+';color:'+r.t+'">'+r.n+' <b>'+r.r+'</b></span>'}).join('')}
function bars(items){var mx=Math.max.apply(null,items.map(function(i){return i[1]}).concat(1));return items.map(function(i){return '<div class="br"><span>'+esc(i[0])+'</span><i><u style="width:'+(i[1]/mx*100)+'%;background:'+(i[2]||'var(--acc)')+'"></u></i><b>'+i[1]+'</b></div>'}).join('')}
drawRanks();
var SV='split',showStats=false,showPts=false,STC=['','#f7cf4f','#a9b8d0','#c9722b','#9b7be6','#6b5f85'];
function save(){}
function load(){try{var s=JSON.parse(document.getElementById('state').textContent||'null');if(s&&Array.isArray(s.P)){P.length=0;s.P.forEach(function(x){P.push(x)});BAN.length=0;(s.BAN||[]).forEach(function(x){BAN.push(x)});LOG=s.LOG||[];if(LOG.length)drawTicker()}}catch(e){}}
function drawStats(){
  var el=document.getElementById('stats');if(!el)return;
  var M=MODES.slice(1),
  cols=SV==='split'?TIERS.map(function(t){return{l:t,ts:[t],g:+t[2]}}):[1,2,3,4,5].map(function(g){return{l:'Tier '+g,ts:['HT'+g,'LT'+g],g:g}}),
  cnt=function(m,ts){return P.filter(function(p){return ts.indexOf(p.t[m])>-1}).length},
  grid=M.map(function(m){return cols.map(function(c){return cnt(m,c.ts)})}),
  mx=Math.max.apply(null,[].concat.apply([],grid).concat(1)),
  rowTot=M.map(function(m){return P.filter(function(p){return p.t[m]}).length}),
  ratings=rowTot.reduce(function(a,b){return a+b},0),t1=0,best=0;
  P.forEach(function(p){Object.keys(p.t).forEach(function(m){if(p.t[m][2]==='1')t1++})});
  rowTot.forEach(function(v,i){if(v>rowTot[best])best=i});
  var card=function(v,l,s){return '<div><b>'+v+'</b><span>'+l+'</span>'+(s?'<span>'+s+'</span>':'')+'</div>'};
  var tpl='grid-template-columns:130px repeat('+cols.length+',minmax(46px,1fr)) 64px';
  var mh='<div class="mx" style="'+tpl+'"><div></div>'+cols.map(function(c){return '<div class="hc" style="border-top:3px solid '+STC[c.g]+'">'+c.l+'</div>'}).join('')+'<div class="hc">Total</div>';
  M.forEach(function(m,i){
    mh+='<button class="rn" data-go="'+m+'" title="Open '+m+' list">'+icon(m,22)+m+'</button>'+grid[i].map(function(v,j){var c=cols[j],a=.15+.7*v/mx;return v?'<div class="cl" title="'+m+' '+c.l+': '+v+'" style="--c:'+STC[c.g]+';--a:'+a.toFixed(2)+';color:'+(a>.5?(c.g===5?'#fff':'#10131a'):'var(--ink)')+'">'+v+'</div>':'<div class="cl z">\u00b7</div>'}).join('')+'<div class="tt">'+rowTot[i]+'</div>';
  });
  mh+='<div class="tt" style="text-align:left">Total</div>'+cols.map(function(c,j){return '<div class="tt">'+grid.reduce(function(a,r){return a+r[j]},0)+'</div>'}).join('')+'<div class="tt">'+ratings+'</div></div>';
  var grp=function(m){return [1,2,3,4,5].map(function(g){return cnt(m,['HT'+g,'LT'+g])})},
  allArr=[0,1,2,3,4].map(function(k){return M.reduce(function(a,m){return a+grp(m)[k]},0)}),
  drow=function(label,arr,tot){return '<div class="db"><span class="nm">'+label+'</span><div class="bar">'+arr.map(function(v,k){return v?'<i style="width:'+(v/Math.max(tot,1)*100)+'%;background:'+STC[k+1]+'" title="Tier '+(k+1)+': '+v+'"></i>':''}).join('')+'</div><b>'+tot+'</b></div>'},
  rc=RANKS.map(function(r){return [r.n,P.filter(function(p){return rk(p)===r}).length,r.c]});
  el.innerHTML='<h2>Statistics</h2><p class="meta" style="margin:0">How many players hold each tier in every gamemode</p>'+
   '<div class="stc">'+card(P.length,'players ranked',BAN.length+' banned')+card(ratings,'tiers given')+card(icon(M[best],28)+rowTot[best],'players in '+M[best],'most popular gamemode')+card(t1,'Tier 1 spots',(ratings?(t1/ratings*100).toFixed(1):'0')+'% of all tiers')+'</div>'+
   '<div class="stp"><div class="sth"><h3>Tiers by gamemode</h3><div class="seg"><button data-sv="split" aria-pressed="'+(SV==='split')+'">HT / LT</button><button data-sv="group" aria-pressed="'+(SV==='group')+'">Tier 1\u20135</button></div></div><div class="scroll">'+mh+'</div><p class="meta">Click a gamemode to open its list.</p></div>'+
   '<div class="stp"><div class="sth"><h3>Tier distribution</h3><div class="lg">'+[1,2,3,4,5].map(function(g){return '<span><i style="background:'+STC[g]+'"></i>Tier '+g+'</span>'}).join('')+'</div></div>'+drow('All gamemodes',allArr,ratings)+M.map(function(m,i){return drow(icon(m,20)+m,grp(m),rowTot[i])}).join('')+'</div>'+
   '<div class="stp"><div class="sth"><h3>Players per rank</h3></div>'+bars(rc)+'</div>';
}
document.getElementById('stats').addEventListener('click',function(e){var s=e.target.closest('[data-sv]'),g=e.target.closest('[data-go]');if(s){SV=s.dataset.sv;drawStats()}else if(g){mode=g.dataset.go;showStats=false;render()}});

  }

}

var DB=null,DT=0,DWR=0,LASTW={},LASTM='';

function dbFlush(force){
  if(!DB||(!ADM&&force!==true))return;
  var cur={},jobs=[],m=JSON.stringify({BAN:BAN,LOG:LOG});
  P.forEach(function(p){cur[pid(p.name)]=JSON.stringify(p)});
  Object.keys(cur).forEach(function(k){if(LASTW[k]!==cur[k]){var v=cur[k];jobs.push(DB.collection('players').doc(k).set({j:v}).then(function(){LASTW[k]=v}))}});
  Object.keys(LASTW).forEach(function(k){if(!(k in cur))jobs.push(DB.collection('players').doc(k).delete().then(function(){delete LASTW[k]}))});
  if(LASTM!==m)jobs.push(DB.doc('meta/state').set({j:m}).then(function(){LASTM=m}));
  if(!jobs.length)return;
  DWR++;
  Promise.all(jobs).then(function(){DWR--;if(typeof tsOk==='function')tsOk();if(!ART){PEND=false;sb('ok','Saved \u2713');setPub('Saved live');setTimeout(function(){sb('','Save');setPub('')},3000)}}).catch(function(){DWR--;if(typeof tsFail==='function')tsFail();sb('err','Not saved');setPub('Couldn\u2019t save \u2013 you need edit access to this page');setTimeout(function(){sb('','Save \u2022')},3500)});
}

  });

function dcCallback(){
  var h=location.hash;if(h.indexOf('access_token=')<0)return;
  var q={};h.slice(1).split('&').forEach(function(kv){var a=kv.split('=');q[a[0]]=decodeURIComponent(a[1]||'')});
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  var s=null;try{s=sessionStorage.getItem('bt:dcs');sessionStorage.removeItem('bt:dcs')}catch(e){}
  if(!q.access_token||!s||q.state!==s)return;
  try{sessionStorage.setItem('bt:dct',q.access_token)}catch(e){}try{localStorage.setItem('bottiers:dct',JSON.stringify({t:q.access_token,x:Date.now()+(+q.expires_in||604800)*1000-60000}))}catch(e){}
  fetch('https://discord.com/api/users/@me',{headers:{Authorization:'Bearer '+q.access_token}}).then(function(r){return r.ok?r.json():null}).then(function(u){
    if(!u||!/^\d{15,22}$/.test(u.id))return;
    ME={id:u.id,n:String(u.global_name||u.username||'Discord user').slice(0,40),a:dcOK(u.avatar)?u.avatar:''};
    try{localStorage.setItem('bottiers:dc',JSON.stringify(ME))}catch(e){}
    drawDc();
  }).catch(function(){});
}

function issueRepo(){
  if(ISSUE_REPO)return ISSUE_REPO;
  if(typeof GH!=='undefined'&&GH&&GH.repo)return GH.repo;
  var m=/^([^.]+)\.github\.io$/i.exec(location.hostname);
  if(m){var seg=location.pathname.split('/')[1];return m[1]+'/'+(seg||m[1]+'.github.io')}

}
function issueUrl(title,text,code){

}

function closeIssue(n,why){

  fetch('https://api.github.com/repos/'+r+'/issues/'+n,{method:'PATCH',headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({state:'closed',state_reason:why||'completed'})}).catch(function(){});
}
function ghReqs(cb){
  var r=issueRepo();if(!r)return cb();

  fetch('https://api.github.com/repos/'+r+'/issues?state=open&per_page=60',{headers:h,cache:'no-store'}).then(function(x){return x.ok?x.json():[]}).then(function(a){
    GRQ=[];

      if(o)GRQ.push({o:o,n:is.number,u:is.user&&is.user.login||'?'});
