<style id="appstyle">:root{--bg:#7fe9dd;--panel:#effffd;--ink:#06302c;--mute:#2f5f5a;--line:#4fc4b8;--acc:#0f766e;--t1:#d4a017;--t2:#8e97a8;--t3:#b8742f;--t4:#3f8f6a;--t5:#5a7bb8;

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

.chip{display:inline-flex;align-items:center;gap:4px}button.chip{border:0;padding:3px 8px;font:700 11px/1.4 "Trebuchet MS",system-ui,sans-serif;cursor:pointer}.ic{vertical-align:-2px;flex:none}

main #stats{margin-top:0;padding:0;background:none;border:0}
.stc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.stc>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stc b{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1.1}.stc span{display:block;font-size:12px;color:var(--mute);margin-top:4px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}.sb{background:var(--bg);border-radius:10px;padding:10px 12px}.sb b{display:block;font-size:24px;line-height:1.2}.sb span{font-size:12px;color:var(--mute)}
.sq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:10px}.sq .sn{margin-left:auto;font-size:15px}.sq .sn b{font-size:22px}

.card .warn{margin-top:14px;padding:12px 14px;border:1px solid #c0392b;border-radius:10px;background:rgba(192,57,43,.14)}.card .warn p{margin:6px 0 12px;font-size:13px;color:var(--ink)}
.cw{position:relative;margin-top:8px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px}

.row{grid-template-columns:36px 44px 1fr auto;cursor:pointer;transition:border-color .15s}.row:hover{border-color:var(--acc)}

function icon(m,s){return IMG[m]?'<img class="ic" alt="'+m+'" src="'+IMG[m]+'" width="'+s+'" height="'+s+'" style="object-fit:contain">':''}
function ask(title,msg,k,md){document.getElementById('warn').innerHTML='<div class="warn" role="alert"><b>\u26a0 '+esc(title)+'</b><p>'+esc(msg)+'</p><button class="danger" id="yes" data-k="'+k+'" data-md="'+md+'">Yes, delete</button> <button id="no">Cancel</button></div>'}
card.addEventListener('click',function(e){
  if(!ADM)return;var t=e.target,h=document.getElementById('hist'),name=h?h.dataset.p:'',p=P.filter(function(x){return x.name===name})[0];
  if(!p||!t.dataset)return;
  if(t.dataset.rm)ask('Remove the '+t.dataset.rm+' tier?','This deletes '+name+'\u2019s '+t.dataset.rm+' rating and its whole history. This can\u2019t be undone.','rm',t.dataset.rm);
  else if(t.id==='delp')askDel('warn',name,['ybn','ydl','no']);
  else if(t.id==='ybn'){ban(p,'Banned');banlog(name);closeP();render()}
  else if(t.id==='ydl'){wipe(name);closeP();render()}
  else if(t.id==='no')document.getElementById('warn').innerHTML='';
  else if(t.id==='yes'){
    if(t.dataset.k==='rm'){delete p.t[t.dataset.md];if(p.h)delete p.h[t.dataset.md];touch();render();openProfile(name)}
    else{ban(p,'Deleted');banlog(name);closeP();render()}
  }
});
(function(){
  var f=document.getElementById('add'),w=document.getElementById('fwarn');
  function find(n){return P.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0]}
  function ask2(title,msg,k,n,m){w.innerHTML='<div class="warn" role="alert"><b>\u26a0 '+esc(title)+'</b><p>'+esc(msg)+'</p><button type="button" class="danger" id="fyes" data-k="'+k+'" data-n="'+esc(n)+'" data-md="'+m+'">Yes, delete</button> <button type="button" id="fno">Cancel</button></div>'}
  function info(msg){w.innerHTML='<div class="warn" role="alert"><p>'+esc(msg)+'</p></div>'}
  f.addEventListener('click',function(e){
    if(!ADM)return;var id=e.target.id,n=document.getElementById('fn').value.trim(),m=fm.value,p=n&&find(n);
    if(id==='fdt'||id==='fdp'){
      if(!n)return info('Type the player name first.');
      if(!p)return info('No player called '+n+' found.');
      if(id==='fdt'){
        if(!p.t[m])return info(p.name+' has no '+m+' tier to remove.');
        ask2('Remove '+p.name+'\u2019s '+m+' tier?','This deletes the '+m+' rating and its whole history. The player stays. This can\u2019t be undone.','t',p.name,m);
      }else askDel('fwarn',p.name,['fbn','fdl','fno']);
    }else if(id==='fbn'){var q2=find(e.target.dataset.n);if(q2){ban(q2,'Banned');banlog(q2.name)}w.innerHTML='';f.reset();render()}
    else if(id==='fdl'){wipe(e.target.dataset.n);w.innerHTML='';f.reset();render()}
    else if(id==='fno')w.innerHTML='';
    else if(id==='fyes'){
      var q=find(e.target.dataset.n),md=e.target.dataset.md;
      if(q){if(e.target.dataset.k==='t'){delete q.t[md];if(q.h)delete q.h[md];mode=md;touch()}else{ban(q,'Deleted');banlog(q.name)}}
      w.innerHTML='';f.reset();render();
    }
  });
})();
function wipe(n){if(!ADM)return;var i=P.map(function(x){return x.name}).indexOf(n);if(i>-1)P.splice(i,1);LOG=LOG.filter(function(l){return typeof l==='string'?l.indexOf(n)<0:l.n!==n});touch();drawTicker()}
function askDel(box,name,ids){document.getElementById(box).innerHTML='<div class="warn" role="alert"><b>⚠ Remove '+esc(name)+'?</b><p>All tiers and history are cleared either way. This can’t be undone.</p><p><b>Ban</b> moves them to the Banned tab. <b>Delete only</b> erases the profile so they show up nowhere.</p><button type="button" class="danger" id="'+ids[0]+'" data-n="'+esc(name)+'">Ban player</button> <button type="button" class="danger" id="'+ids[1]+'" data-n="'+esc(name)+'">Delete only</button> <button type="button" id="'+ids[2]+'">Cancel</button></div>'}
function drawTicker(){

function issueRepo(){

}

}

    else if(ka[0]==='g'){git=GRQ.filter(function(x){return String(x.n)===kid})[0];o=git&&git.o}
    else o=rqDec(REQ[+kid]);
    if(!o)return;
    var rr=rqCheck(o);if(!rr.ok)return reqModal(rr.msg);
    var ap=tsApply(o,{P:P,BAN:BAN,LOG:LOG});if(!ap.ok)return reqModal(ap.msg);
    if(o.type==='give'){mode=o.kit;flash=ap.p.name;drawTicker()}
    render();touch();
    if(ka[0]==='s')rqServerDone(kid,'Accepted: '+ap.msg);
    else if(git){GHMAP[o.me.toLowerCase()]=git.u;try{localStorage.setItem('bt:ghmap',JSON.stringify(GHMAP))}catch(x){}doneMark(git.n);closeIssue(git.n,'completed');GRQ=GRQ.filter(function(x){return x.n!==git.n});drawRq();reqModal('Accepted: '+ap.msg)}
    else{REQ.splice(+kid,1);rqSave();drawRq();reqModal('Accepted: '+ap.msg)}
  }
});

  if(e.target.id!=='tsk')return;var me=tsMe();if(me&&me.t[e.target.value])tsEl('tst').innerHTML=tsOpts(me,e.target.value);
});
