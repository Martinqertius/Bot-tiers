<style id="appstyle">:root{--bg:#7fe9dd;--panel:#effffd;--ink:#06302c;--mute:#2f5f5a;--line:#4fc4b8;--acc:#0f766e;--t1:#d4a017;--t2:#8e97a8;--t3:#b8742f;--t4:#3f8f6a;--t5:#5a7bb8;

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

.chip{display:inline-flex;align-items:center;gap:4px}button.chip{border:0;padding:3px 8px;font:700 11px/1.4 "Trebuchet MS",system-ui,sans-serif;cursor:pointer}.ic{vertical-align:-2px;flex:none}

main #stats{margin-top:0;padding:0;background:none;border:0}
.stc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.stc>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stc b{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1.1}.stc span{display:block;font-size:12px;color:var(--mute);margin-top:4px}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}.sb{background:var(--bg);border-radius:10px;padding:10px 12px}.sb b{display:block;font-size:24px;line-height:1.2}.sb span{font-size:12px;color:var(--mute)}
.sq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:10px}.sq .sn{margin-left:auto;font-size:15px}.sq .sn b{font-size:22px}

.card .warn{margin-top:14px;padding:12px 14px;border:1px solid #c0392b;border-radius:10px;background:rgba(192,57,43,.14)}.card .warn p{margin:6px 0 12px;font-size:13px;color:var(--ink)}
.cw{position:relative;margin-top:8px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px}

.row{grid-template-columns:36px 44px 1fr auto;cursor:pointer;transition:border-color .15s}.row:hover{border-color:var(--acc)}

.nadd{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;cursor:pointer;font-weight:800;padding:9px 16px;border:2px dashed var(--line);border-radius:12px;color:var(--nac)}
.nadd:hover{border-color:var(--acc)}
#nlight{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
#nlight[hidden]{display:none}
#nlight img{max-width:94vw;max-height:88vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#nlight button{position:absolute;width:44px;height:44px;border-radius:50%;padding:0;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;line-height:1}
#nlight .lc{top:16px;right:16px}#nlight .lp{left:14px;top:50%}#nlight .ln{right:14px;top:50%}
#ntoast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#2b1503;color:#ffd9ad;font-weight:800;padding:11px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .2s,transform .2s}
#ntoast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.nb,.ncard,.nimg img,#ntoast{transition:none}}
@media (max-width:480px){header .lg{gap:8px;flex-wrap:nowrap}header .logo span{font-size:20px}header .logo svg{width:30px;height:30px}.nb{padding:9px 12px;font-size:13px}.nb .soon{display:none}}

.nhb{display:flex;gap:8px;flex-wrap:wrap}
.ncm{border-radius:999px;font-weight:800;padding:9px 16px}
.ncats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.ncf{border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;background:var(--panel);border:2px solid hsl(var(--ch,172) 55% 40%);color:var(--ink);cursor:pointer}
.ncf b{opacity:.65;margin-left:3px}
.ncf.on{background:hsl(var(--ch,172) 65% 34%);border-color:hsl(var(--ch,172) 65% 34%);color:#fff}
.ncat{display:inline-block;background:hsl(var(--ch,172) 65% 34%);color:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 10px;border-radius:999px}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nov .ncat{box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ncp{display:flex;flex-wrap:wrap;gap:6px}
.ncrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ncrow input{flex:1 1 140px;min-width:0}
</style>

  if(!ADM)return;var t=e.target,h=document.getElementById('hist'),name=h?h.dataset.p:'',p=P.filter(function(x){return x.name===name})[0];
  if(!p||!t.dataset)return;
  if(t.dataset.rm)ask('Remove the '+t.dataset.rm+' tier?','This deletes '+name+'\u2019s '+t.dataset.rm+' rating and its whole history. This can\u2019t be undone.','rm',t.dataset.rm);
  else if(t.id==='delp')askDel('warn',name,['ybn','ydl','no']);
  else if(t.id==='ybn'){ban(p,'Banned');banlog(name);closeP();render()}
  else if(t.id==='ydl'){wipe(name);closeP();render()}
  else if(t.id==='no')document.getElementById('warn').innerHTML='';
  else if(t.id==='yes'){
    if(t.dataset.k==='rm'){delete p.t[t.dataset.md];if(p.h)delete p.h[t.dataset.md];touch();render();openProfile(name)}
    else{ban(p,'Deleted');banlog(name);closeP();render()}
  }
});
(function(){
  var f=document.getElementById('add'),w=document.getElementById('fwarn');
  function find(n){return P.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0]}
  function ask2(title,msg,k,n,m){w.innerHTML='<div class="warn" role="alert"><b>\u26a0 '+esc(title)+'</b><p>'+esc(msg)+'</p><button type="button" class="danger" id="fyes" data-k="'+k+'" data-n="'+esc(n)+'" data-md="'+m+'">Yes, delete</button> <button type="button" id="fno">Cancel</button></div>'}
  function info(msg){w.innerHTML='<div class="warn" role="alert"><p>'+esc(msg)+'</p></div>'}
  f.addEventListener('click',function(e){
    if(!ADM)return;var id=e.target.id,n=document.getElementById('fn').value.trim(),m=fm.value,p=n&&find(n);
    if(id==='fdt'||id==='fdp'){
      if(!n)return info('Type the player name first.');
      if(!p)return info('No player called '+n+' found.');
      if(id==='fdt'){
        if(!p.t[m])return info(p.name+' has no '+m+' tier to remove.');
        ask2('Remove '+p.name+'\u2019s '+m+' tier?','This deletes the '+m+' rating and its whole history. The player stays. This can\u2019t be undone.','t',p.name,m);
      }else askDel('fwarn',p.name,['fbn','fdl','fno']);
    }else if(id==='fbn'){var q2=find(e.target.dataset.n);if(q2){ban(q2,'Banned');banlog(q2.name)}w.innerHTML='';f.reset();render()}
    else if(id==='fdl'){wipe(e.target.dataset.n);w.innerHTML='';f.reset();render()}
    else if(id==='fno')w.innerHTML='';
    else if(id==='fyes'){
      var q=find(e.target.dataset.n),md=e.target.dataset.md;
      if(q){if(e.target.dataset.k==='t'){delete q.t[md];if(q.h)delete q.h[md];mode=md;touch()}else{ban(q,'Deleted');banlog(q.name)}}
      w.innerHTML='';f.reset();render();
    }
  });
})();
function wipe(n){if(!ADM)return;var i=P.map(function(x){return x.name}).indexOf(n);if(i>-1)P.splice(i,1);LOG=LOG.filter(function(l){return typeof l==='string'?l.indexOf(n)<0:l.n!==n});touch();drawTicker()}
function askDel(box,name,ids){document.getElementById(box).innerHTML='<div class="warn" role="alert"><b>⚠ Remove '+esc(name)+'?</b><p>All tiers and history are cleared either way. This can’t be undone.</p><p><b>Ban</b> moves them to the Banned tab. <b>Delete only</b> erases the profile so they show up nowhere.</p><button type="button" class="danger" id="'+ids[0]+'" data-n="'+esc(name)+'">Ban player</button> <button type="button" class="danger" id="'+ids[1]+'" data-n="'+esc(name)+'">Delete only</button> <button type="button" id="'+ids[2]+'">Cancel</button></div>'}
function drawTicker(){
  var xb=function(h,i){var en=LOG[i];if(en&&typeof en==='object'&&en.big&&!en.ban)h=h.replace('class="big"','class="big" data-li="'+i+'"');return h.replace(/<\/span>$/,'<button type="button" class="dx" data-dx="'+i+'" aria-label="Remove from ticker" title="Remove from ticker">\u00d7</button></span>')};
  var h='<i class="dot"></i>'+LOG.map(function(l,i){return xb((function(){
    if(typeof l==='string')return '<span>'+esc(l)+'</span>';
    if(l.ban)return '<span class="big" data-pn="'+esc(l.n)+'" title="Open profile">'+av(l.n,24)+'<b>'+esc(l.n)+'</b><span class="chip" style="background:#c0392b">Banned</span><span class="meta">'+esc(l.r)+' ('+l.d+')</span></span>';
    if(!l.big)return '<span>'+esc(l.s+' ('+l.d+')')+'</span>';
    return '<span class="big" data-pn="'+esc(l.n)+'" title="Open profile">'+av(l.n,24)+'<b>'+esc(l.n)+'</b>'+icon(l.m,18)+'<span class="chip '+cls(l.t)+'">'+l.t+'</span><span class="meta">'+l.d+'</span></span>';
  })(),i)}).join('');
  document.getElementById('ticker').innerHTML=LOG.length?h:'<i class="dot"></i><span>Your rating changes will show up here</span>';
}
document.getElementById('ticker').addEventListener('click',function(e){var d=e.target.closest('[data-dx]');if(d){if(!ADM)return;e.stopPropagation();LOG.splice(+d.dataset.dx,1);touch();drawTicker();return}var s=e.target.closest('[data-pn]');if(s){if(s.dataset.li!==undefined)openFight(+s.dataset.li);else openProfile(s.dataset.pn)}});
/* ---- fight history: stored on each tier-history entry, shown in the profile and the live updates board ---- */
var FT=null;
function normScore(s){s=(s||"").trim();if(!s)return "";var m=/^(\d{1,3})\s*[-\u2013:]\s*(\d{1,3})$/.exec(s);return m?m[1]+"-"+m[2]:null}
function fightText(f){var w=[f.tt,f.tl].filter(Boolean).join(", ");return f.r+(f.s?" "+f.s:"")+(w?" ("+w+")":"")}
function fchips(e){return (e&&e.f||[]).map(function(f){return '<span class="fight '+(f.r==="Won"?"won":"lost")+'">'+esc(fightText(f))+'</span>'}).join("")}
function histRows(p,m,L){return '<div>'+L.map(function(e,k){return {e:e,k:k}}).reverse().map(function(o){var e=o.e,ds=' data-hm="'+esc(m)+'" data-hp="'+esc(p.name)+'"';return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px"><span class="chip '+cls(e.t)+'">'+e.t+'</span><span class="meta">'+fd(e.ts)+'</span>'+(e.ev?'<span class="fight won">+Eval</span>':'')+fchips(e)+'<button type="button" class="fx" data-hf="'+o.k+'"'+ds+'>+ Fight</button>'+(canEv(e.t)?'<button type="button" class="fx" data-he="'+o.k+'"'+ds+'>'+(e.ev?'Remove eval':'+ Eval')+'</button>':'')+(canEv(e.t)&&e.ev&&e.ev.x?'<div class="meta" style="width:100%;white-space:pre-wrap">Eval: '+esc(e.ev.x)+(e.ev.by?' ('+esc(e.ev.by)+')':'')+'</div>':'')+'</div>'}).join("")+'</div>'}
function getE(){if(!FT)return null;var p=P.filter(function(x){return x.name===FT.n})[0];if(!p)return null;return hist(p,FT.m)[FT.k]||null}
function entryFor(l){var p=P.filter(function(x){return x.name===l.n})[0];if(!p||!l.m||!p.t[l.m])return null;var L=hist(p,l.m),k=-1,i;for(i=L.length-1;i>=0;i--)if(L[i].t===l.t){k=i;break}return k<0?null:{n:p.name,m:l.m,k:k}}
function openFightFor(n,m,k){FT={n:n,m:m,k:k};drawFight();openM()}
function openFight(i){
  var l=LOG[i];if(!l||typeof l!=="object")return;
  FT=entryFor(l)||{n:l.n,m:l.m,k:-1};
  var e=getE();if(e&&l.f){e.f=(e.f||[]).concat(l.f);delete l.f;touch()}
  drawFight();openM();
}
function drawFight(){
  var e=getE();
  if(!e){card.innerHTML='<h3>Fight history</h3><p class="meta">No tier history found for this rating.</p><p><button type="button" id="fcprof">View profile</button> <button type="button" id="x">Close</button></p>';return}
  var fs=e.f||[];
  card.innerHTML='<h3>Fight history</h3><p class="meta">'+esc(FT.n)+' &middot; '+esc(e.t)+' in '+esc(FT.m)+' &middot; '+fd(e.ts)+'</p>'+
    '<div>'+(fs.length?fs.map(function(f,k){return '<p style="display:flex;align-items:center;gap:8px;margin:8px 0 0"><span class="fight '+(f.r==="Won"?"won":"lost")+'">'+esc(fightText(f))+'</span><button type="button" class="fx" data-ffrm="'+k+'" aria-label="Remove this fight" title="Remove this fight" style="font-size:16px">\u00d7</button></p>'}).join(""):'<p class="meta">No fights added yet.</p>')+'</div>'+
    (ADM?'<p style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><select id="fcr" aria-label="Result"><option>Won</option><option>Lost</option></select><input id="fcs" placeholder="Score, e.g. 5-6" maxlength="7" size="12" aria-label="Score"><input id="fct" placeholder="Tester name" maxlength="16" size="14" aria-label="Tester name"><select id="fcl" aria-label="Tester tier"><option value="">Tester tier</option>'+TIERS.map(function(t){return '<option>'+t+'</option>'}).join("")+'</select><button type="button" id="fcadd">Add fight</button></p><p id="fce" class="meta" style="color:#c0392b" role="alert"></p>':'')+
    '<p><button type="button" id="fcprof">View profile</button> <button type="button" id="x">Close</button></p>';
}
function addFight(){
  var e=getE(),er=document.getElementById("fce");if(!e)return;
  var s=normScore(document.getElementById("fcs").value);
  if(s===null){er.textContent="Score should look like 5-6.";return}
  e.f=e.f||[];e.f.push({r:document.getElementById("fcr").value,s:s,tt:document.getElementById("fct").value.trim(),tl:document.getElementById("fcl").value});
  touch();drawFight();document.getElementById("fcs").focus();
}
function backToProfile(){var n=FT.n,m=FT.m;openProfile(n);var p=P.filter(function(x){return x.name===n})[0];if(p&&p.t[m])showHist(n,m)}
function canEv(t){return t==="LT3"||t==="LT2"||t==="LT1"}
function evOf(p,m){var L=p.h&&p.h[m],i;if(!L)return null;for(i=L.length-1;i>=0;i--)if(L[i].t===p.t[m])return L[i];return null}
function evTag(p,m){var e=canEv(p.t[m])&&evOf(p,m);return e&&e.ev?' +Eval':''}
function toggleEval(n,m,k){FT={n:n,m:m,k:k};var e=getE();if(!e||!canEv(e.t))return;if(e.ev)delete e.ev;else e.ev={ts:Date.now()};touch();backToProfile()}
document.getElementById("add").addEventListener("submit",function(){
  if(!ADM)return;var n=document.getElementById("fn").value.trim(),m=fm.value,t=ft.value;if(!canEv(t)||!n)return;

    document.getElementById("fwarn").innerHTML='<div class="warn" style="border-color:var(--acc);background:none" role="status"><p>'+esc(p.name)+' got '+esc(t)+' in '+esc(m)+'.</p><button type="button" id="fev" data-n="'+esc(p.name)+'" data-m="'+esc(m)+'" data-t="'+t+'">+ Eval</button> <button type="button" id="fevno">Not now</button></div>'},0);
},true);
document.getElementById("fwarn").addEventListener("click",function(e){var id=e.target.id;if(id==="fevno"){this.innerHTML="";return}if(id==="fev"&&ADM){var n=e.target.dataset.n,ee=entryFor({n:n,m:e.target.dataset.m,t:e.target.dataset.t});if(ee){FT=ee;var en=getE();if(en){en.ev={ts:Date.now()};touch()}}this.innerHTML='<div class="warn" style="border-color:var(--acc);background:none" role="status"><p>+Eval given to '+esc(n)+'.</p></div>'}});
card.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.id==="fcprof"&&FT){var n=FT.n,m=FT.m;openProfile(n);var p=P.filter(function(x){return x.name===n})[0];if(p&&p.t[m])showHist(n,m);return}

  else if(t.dataset&&t.dataset.ffrm!==undefined){var e=getE();if(e&&e.f){e.f.splice(+t.dataset.ffrm,1);if(!e.f.length)delete e.f;touch();drawFight()}}
});
card.addEventListener("keydown",function(e){if(e.key==="Enter"&&ADM&&FT&&(e.target.id==="fcs"||e.target.id==="fct")){e.preventDefault();addFight()}});
var BAN=[];
function nowd(){return new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'})}
function ban(p,r){var i=P.indexOf(p);if(i>-1)P.splice(i,1);p.t={};p.h={};p.ban={r:r,d:nowd()};BAN.unshift(p);touch()}
function sd(){return new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})}
function openBanned(p){
  card.innerHTML='<div class="top">'+av(p.name,96)+'<div><h3>'+esc(p.name)+'</h3><div class="meta">Banned player</div></div></div><div class="chips"><span class="chip" style="background:#c0392b;font-size:16px;padding:8px 14px">Banned</span></div><p>'+esc(p.ban.r)+' &middot; '+p.ban.d+'. Saving a new rating for this player in the form unbans them.</p><p><button id="x">Close</button></p>';
  openM();
}
function banlog(n){LOG.unshift({ban:true,big:true,n:n,r:'Deleted',d:sd()});LOG=LOG.slice(0,6);drawTicker()}
function bannedView(f){
  var L=BAN.filter(function(p){return !f||p.name.toLowerCase().indexOf(f)>-1}),h='<p class="meta">Players with 0 points or who were deleted end up here. Saving a new rating for one unbans them.</p>';
  if(!L.length)return h+'<p class="empty">Nobody is banned.</p>';

}
var RANKS=[{n:'Nováček',min:1,r:'1–19',c:'#7d8594',t:'#fff'},{n:'Strážce',min:20,r:'20–49',c:'#3f8f6a',t:'#fff'},{n:'Bojovník',min:50,r:'50–99',c:'#3b73c4',t:'#fff'},{n:'Combat Cadet',min:100,r:'100–199',c:'#7d4fc4',t:'#fff'},{n:'Combat Master',min:200,r:'200–299',c:'#d9742a',t:'#fff'},{n:'Combat Grandmaster',min:300,r:'300+',c:'#f7cf4f',t:'#2a2200'}];
function rk(p){var s=pts(p),r=null;RANKS.forEach(function(x){if(s>=x.min)r=x});return r}
function rkb(p){var r=rk(p);return r?'<span class="rk" style="background:'+r.c+';color:'+r.t+'">'+r.n+'</span>':''}
function drawRanks(){document.getElementById('rankbar').innerHTML='<small class="meta">Ranks by points</small>'+RANKS.map(function(r){return '<span class="rk" style="background:'+r.c+';color:'+r.t+'">'+r.n+' <b>'+r.r+'</b></span>'}).join('')}
function bars(items){var mx=Math.max.apply(null,items.map(function(i){return i[1]}).concat(1));return items.map(function(i){return '<div class="br"><span>'+esc(i[0])+'</span><i><u style="width:'+(i[1]/mx*100)+'%;background:'+(i[2]||'var(--acc)')+'"></u></i><b>'+i[1]+'</b></div>'}).join('')}
drawRanks();
var SV='split',showStats=false,showPts=false,STC=['','#f7cf4f','#a9b8d0','#c9722b','#9b7be6','#6b5f85'];
function save(){}
function load(){try{var s=JSON.parse(document.getElementById('state').textContent||'null');if(s&&Array.isArray(s.P)){P.length=0;s.P.forEach(function(x){P.push(x)});BAN.length=0;(s.BAN||[]).forEach(function(x){BAN.push(x)});LOG=s.LOG||[];NEWS=Array.isArray(s.NEWS)?s.NEWS:[];if(LOG.length)drawTicker()}}catch(e){}}
function drawStats(){
  var el=document.getElementById('stats');if(!el)return;
  var M=MODES.slice(1),
  cols=SV==='split'?TIERS.map(function(t){return{l:t,ts:[t],g:+t[2]}}):[1,2,3,4,5].map(function(g){return{l:'Tier '+g,ts:['HT'+g,'LT'+g],g:g}}),
  cnt=function(m,ts){return P.filter(function(p){return ts.indexOf(p.t[m])>-1}).length},
  grid=M.map(function(m){return cols.map(function(c){return cnt(m,c.ts)})}),
  mx=Math.max.apply(null,[].concat.apply([],grid).concat(1)),
  rowTot=M.map(function(m){return P.filter(function(p){return p.t[m]}).length}),
  ratings=rowTot.reduce(function(a,b){return a+b},0),t1=0,best=0;
  P.forEach(function(p){Object.keys(p.t).forEach(function(m){if(p.t[m][2]==='1')t1++})});
  rowTot.forEach(function(v,i){if(v>rowTot[best])best=i});
  var card=function(v,l,s){return '<div><b>'+v+'</b><span>'+l+'</span>'+(s?'<span>'+s+'</span>':'')+'</div>'};

  M.forEach(function(m,i){
    mh+='<button class="rn" data-go="'+m+'" title="Open '+m+' list">'+icon(m,22)+m+'</button>'+grid[i].map(function(v,j){var c=cols[j],a=.15+.7*v/mx;return v?'<div class="cl" title="'+m+' '+c.l+': '+v+'" style="--c:'+STC[c.g]+';--a:'+a.toFixed(2)+';color:'+(a>.5?(c.g===5?'#fff':'#10131a'):'var(--ink)')+'">'+v+'</div>':'<div class="cl z">\u00b7</div>'}).join('')+'<div class="tt">'+rowTot[i]+'</div>';
  });
  mh+='<div class="tt" style="text-align:left">Total</div>'+cols.map(function(c,j){return '<div class="tt">'+grid.reduce(function(a,r){return a+r[j]},0)+'</div>'}).join('')+'<div class="tt">'+ratings+'</div></div>';
  var grp=function(m){return [1,2,3,4,5].map(function(g){return cnt(m,['HT'+g,'LT'+g])})},
  allArr=[0,1,2,3,4].map(function(k){return M.reduce(function(a,m){return a+grp(m)[k]},0)}),
  drow=function(label,arr,tot){return '<div class="db"><span class="nm">'+label+'</span><div class="bar">'+arr.map(function(v,k){return v?'<i style="width:'+(v/Math.max(tot,1)*100)+'%;background:'+STC[k+1]+'" title="Tier '+(k+1)+': '+v+'"></i>':''}).join('')+'</div><b>'+tot+'</b></div>'},
  rc=RANKS.map(function(r){return [r.n,P.filter(function(p){return rk(p)===r}).length,r.c]});
  el.innerHTML='<h2>Statistics</h2><p class="meta" style="margin:0">How many players hold each tier in every gamemode</p>'+
   '<div class="stc">'+card(P.length,'players ranked',BAN.length+' banned')+card(ratings,'tiers given')+card(icon(M[best],28)+rowTot[best],'players in '+M[best],'most popular gamemode')+card(t1,'Tier 1 spots',(ratings?(t1/ratings*100).toFixed(1):'0')+'% of all tiers')+'</div>'+
   '<div class="stp"><div class="sth"><h3>Tiers by gamemode</h3><div class="seg"><button data-sv="split" aria-pressed="'+(SV==='split')+'">HT / LT</button><button data-sv="group" aria-pressed="'+(SV==='group')+'">Tier 1\u20135</button></div></div><div class="scroll">'+mh+'</div><p class="meta">Click a gamemode to open its list.</p></div>'+
   '<div class="stp"><div class="sth"><h3>Tier distribution</h3><div class="lg">'+[1,2,3,4,5].map(function(g){return '<span><i style="background:'+STC[g]+'"></i>Tier '+g+'</span>'}).join('')+'</div></div>'+drow('All gamemodes',allArr,ratings)+M.map(function(m,i){return drow(icon(m,20)+m,grp(m),rowTot[i])}).join('')+'</div>'+
   '<div class="stp"><div class="sth"><h3>Players per rank</h3></div>'+bars(rc)+'</div>';
}

function headFor(id,cb){

function refreshSkin(p){

function readHead(f,cb){
  var r=new FileReader();
  r.onerror=function(){cb(null)};

    var im=new Image();
    im.onerror=function(){cb(null)};
    im.onload=function(){
      var c=document.createElement('canvas'),x,w=im.width,h=im.height,s;c.width=c.height=64;x=c.getContext('2d');
      if(w%64===0&&(h===w||h===w/2)){s=w/64;x.imageSmoothingEnabled=false;x.drawImage(im,8*s,8*s,8*s,8*s,0,0,64,64);x.drawImage(im,40*s,8*s,8*s,8*s,0,0,64,64)}

  };

}

var DB=null,DT=0,DWR=0,LASTW={},LASTM='';
function pid(n){return n.toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g,function(c){return '~'+c.charCodeAt(0).toString(16)+'~'})}
function dbFlush(force){
  if(!DB||(!ADM&&force!==true))return;
  var cur={},jobs=[],m=JSON.stringify({BAN:BAN,LOG:LOG});
  P.forEach(function(p){cur[pid(p.name)]=JSON.stringify(p)});
  Object.keys(cur).forEach(function(k){if(LASTW[k]!==cur[k]){var v=cur[k];jobs.push(DB.collection('players').doc(k).set({j:v}).then(function(){LASTW[k]=v}))}});
  Object.keys(LASTW).forEach(function(k){if(!(k in cur))jobs.push(DB.collection('players').doc(k).delete().then(function(){delete LASTW[k]}))});
  if(LASTM!==m)jobs.push(DB.doc('meta/state').set({j:m}).then(function(){LASTM=m}));
  jobs=jobs.concat(typeof newsJobs==='function'?newsJobs():[]);if(!jobs.length)return;
  DWR++;
  Promise.all(jobs).then(function(){DWR--;if(typeof tsOk==='function')tsOk();if(!ART){PEND=false;sb('ok','Saved \u2713');setPub('Saved live');setTimeout(function(){sb('','Save');setPub('')},3000)}}).catch(function(){DWR--;if(typeof tsFail==='function')tsFail();sb('err','Not saved');setPub('Couldn\u2019t save \u2013 you need edit access to this page');setTimeout(function(){sb('','Save \u2022')},3500)});
}

    if(DT||DWR)return;
    if(!s.docs.length){claude.use('user').then(function(u){if(u&&u.canEdit&&u.canEdit())dbFlush(true)}).catch(function(){});return}
    var L=[],W={};
    s.docs.forEach(function(x){try{var j=x.data().j;L.push(JSON.parse(j));W[x.id]=j}catch(e){}});
    LASTW=W;
    if(JSON.stringify(P)===JSON.stringify(L))return;
    P.length=0;L.forEach(function(x){P.push(x)});render();
  });
  DB.doc('meta/state').onSnapshot(function(s){
    if(DT||DWR||!s.exists)return;
    var m=s.data().j;if(!m||m===LASTM)return;
    try{var o=JSON.parse(m);LASTM=m;BAN.length=0;(o.BAN||[]).forEach(function(x){BAN.push(x)});LOG=o.LOG||[];drawTicker();render()}catch(e){}
  });

function issueRepo(){

}

  fetch('https://api.github.com/repos/'+r+'/issues?state=open&per_page=60',{headers:h,cache:'no-store'}).then(function(x){return x.ok?x.json():[]}).then(function(a){

function rqEnc(o){return 'BT1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function scRes(s){var m=/^(\d{1,3})-(\d{1,3})$/.exec(String(s||''));if(!m||+m[1]===+m[2])return null;return +m[1]>+m[2]?'Won':'Lost'}
function rqVal(o){
  if(o&&o.type==='equip'){if(!/^\w{3,16}$/.test(String(o.me))||typeof o.cos!=='string'||(o.cos&&!cosOf(o.cos)))return null;return o}
  if(!o||(o.type!=='give'&&o.type!=='eval')||!/^\w{3,16}$/.test(String(o.me))||!/^\w{3,16}$/.test(String(o.n))||MODES.indexOf(o.kit)<1)return null;

function rqDec(s,eq){

    s=String(s).trim();if(s.indexOf('BT1.')!==0)return null;
    var o=rqVal(JSON.parse(decodeURIComponent(escape(atob(s.slice(4))))));

function tsDry(act){

  }).join(''):'<p class="empty">Your inbox is empty.</p>';
  showM(h+'<p>'+CLOSE+'</p>',tsEl('rqbtn'));

function tsOpts(me,kit){var i=TIERS.indexOf(me.t[kit]);return TIERS.filter(function(t,k){return k>=i}).map(function(t){return '<option>'+t+'</option>'}).join('')}

function tsCheck(){

  return {me:me,n:n,kit:kit,mi:TIERS.indexOf(me.t[kit])};
}
/* Applies one tester action to a state {P,BAN,LOG}; used on the local list and again on the freshly loaded saved list. */
function tsApply(act,S){
  var lc=function(s){return String(s).toLowerCase()},kit=act.kit;
  var meP=S.P.filter(function(x){return lc(x.name)===lc(act.me)})[0];
  if(!meP||(meP.tr||[]).indexOf(kit)<0||!meP.t[kit]||MODES.indexOf(kit)<1)return {ok:false,msg:'You aren\u2019t a tester in '+kit+'.'};
  if(lc(act.n)===lc(meP.name))return {ok:false,msg:'You can\u2019t change your own tier.'};
  var mi=TIERS.indexOf(meP.t[kit]),p=S.P.filter(function(x){return lc(x.name)===lc(act.n)})[0];
  if(act.type==='give'){
    var tier=act.tier;
    if(TIERS.indexOf(tier)<0)return {ok:false,msg:'Unknown tier.'};
    if(TIERS.indexOf(tier)<mi)return {ok:false,msg:'You can\u2019t give a tier higher than your own ('+meP.t[kit]+').'};
    if(p&&p.t[kit]&&TIERS.indexOf(p.t[kit])<mi)return {ok:false,msg:p.name+' is above your tier in '+kit+'.'};
    var fi=null;if(act.s){var rs=scRes(act.s);if(!rs)return {ok:false,msg:'The score can\u2019t be a tie.'};fi={r:rs,s:act.s,tt:meP.name,tl:meP.t[kit]}}
    if(!p){var bi=S.BAN.map(function(x){return lc(x.name)}).indexOf(lc(act.n));if(bi>-1){p=S.BAN.splice(bi,1)[0];delete p.ban;p.t={};S.P.push(p)}else{p={name:act.n,region:'\u2013',t:{}};S.P.push(p)}}
    var old=p.t[kit],hh=hist(p,kit),en={t:tier,ts:Date.now()};if(fi)en.f=[fi];hh.push(en);p.t[kit]=tier;
    if(TIERS.indexOf(tier)<=4){S.LOG.unshift({s:p.name+(old?' moved from '+old+' to ':' set to ')+tier+' in '+kit,n:p.name,m:kit,t:tier,big:true,d:sd()});if(S.LOG.length>6)S.LOG.length=6}
    return {ok:true,msg:p.name+' is now '+tier+' in '+kit+(fi?' ('+fi.r+' '+fi.s+')':'')+'.',p:p};
  }
  if(!p||!p.t[kit])return {ok:false,msg:'That player has no '+kit+' tier.'};
  if(TIERS.indexOf(p.t[kit])<mi)return {ok:false,msg:p.name+' is above your tier in '+kit+'.'};
  if(!canEv(p.t[kit]))return {ok:false,msg:'+Eval can only be given on LT3, LT2 or LT1.'};
  hist(p,kit);var e=evOf(p,kit);if(!e)return {ok:false,msg:'Couldn\u2019t find that rating.'};
  var had=!!e.ev;if(had)delete e.ev;else e.ev={ts:Date.now(),by:meP.name};
  return {ok:true,msg:had?'+Eval removed from '+p.name+'.':'+Eval given to '+p.name+'.',p:p};
}
function tsRequest(type){
  var c=tsCheck();if(!c)return;
  var act={type:type,me:c.me.name,n:c.n,kit:c.kit};if(type==='give'){act.tier=tsEl('tst').value;var sc=normScore(tsEl('tss').value);if(!sc)return tsMsg('Enter the score like 1-0 (the player first).',true);if(!scRes(sc))return tsMsg('The score can\u2019t be a tie.',true);act.s=sc}
  if(ADM){var r0=tsApply(act,{P:P,BAN:BAN,LOG:LOG});if(!r0.ok)return tsMsg(r0.msg,true);if(type==='give'){mode=c.kit;flash=r0.p.name;drawTicker()}render();touch();return tsMsg(r0.msg)}
  var r=tsDry(act);if(!r.ok)return tsMsg(r.msg,true);
  if(LINK_API){
    var tk=dcTok();if(!tk)return tsMsg('Your Discord login expired. Log in again, then retry.',true);
    tsMsg('Sending\u2026');
    api('/request',{method:'POST',tok:tk,body:act}).then(function(){tsMsg('Sent to the owner \u2713 They accept it in their Inbox.')}).catch(function(e){tsMsg(e.message,true)});
    return;
  }
  act.d=ME.id;act.dn=String(ME.n);act.ts=Date.now();
  var code=rqEnc(act),gu=issueUrl('[Tester request] '+rqPlain(act),'Tester request from '+act.me+' (Discord: '+act.dn+'): '+rqPlain(act),code);

  function same(a,b){a=(a||'').trim().toLowerCase();b=(b||'').trim().toLowerCase();return !!a&&a===b}
  function hue(n){var h=0;n=(n||'').toLowerCase();for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
  function posts(){return NEWS.filter(function(x){return x.id!==CATID})}
  function catList(){var m=NEWS.filter(function(x){return x.id===CATID})[0];return m&&Array.isArray(m.list)?m.list:[]}
  function setCats(L){var m=NEWS.filter(function(x){return x.id===CATID})[0];if(m)m.list=L;else NEWS.push({id:CATID,k:1,d:0,list:L})}
  function allCats(){var L=catList().slice();posts().forEach(function(p){if(p.c&&!L.some(function(x){return same(x,p.c)}))L.push(p.c)});return L}
  function chip(n){return n?'<span class="ncat" style="--ch:'+hue(n)+'">'+esc(n)+'</span>':''}
  function meta(p){return '<div class="nmeta">'+chip(p.c)+'<span class="nd">'+fmt(p.d)+'</span></div>'}
  function drawCatPick(){
    var g=$('ncp');if(!g||!ED)return;var L=allCats();
    g.innerHTML=L.length?L.map(function(n){return '<button type="button" class="ncf'+(same(ED.c,n)?' on':'')+'" style="--ch:'+hue(n)+'" data-ncpick="'+esc(n)+'">'+esc(n)+'</button>'}).join(''):'<span class="meta">No categories yet. Type one below.</span>';
  }
  function drawCatRows(){
    var g=$('ncl');if(!g)return;
    g.innerHTML=MC.length?MC.map(function(n,i){var k=posts().filter(function(p){return same(p.c,n)}).length;return '<div class="ncrow">'+chip(n)+'<input type="text" maxlength="24" value="'+esc(n)+'" data-ncin="'+i+'" aria-label="Category name"><span class="meta">'+k+' post'+(k===1?'':'s')+'</span><button type="button" data-ncren="'+i+'">Rename</button><button type="button" class="danger" data-ncdel="'+i+'">Delete</button></div>'}).join(''):'<p class="meta">No categories yet. Add the first one below.</p>';
  }
  function openCats(){
    if(!ADM)return;MC=allCats();
    openLayer('<div class="nbox"><button type="button" class="nx" data-nclose aria-label="Close">\u00d7</button><div class="ned"><h3>Categories</h3><p class="meta" style="margin:0">Visitors use these to filter the news. Deleting a category keeps its posts.</p><div id="ncl"></div><div class="ncrow"><input id="ncnew" type="text" maxlength="24" placeholder="New category name"><button type="button" id="ncadd" class="npost">Add</button></div><p id="nems" class="meta" role="status" style="margin:0"></p><div class="nact" style="margin-top:4px"><button type="button" id="necancel">Done</button></div></div></div>');
    drawCatRows();
  }
  function addCat(){
    if(!ADM)return;var i=$('ncnew'),n=i.value.trim();if(!n)return;
    if(allCats().some(function(x){return same(x,n)})){msg('That category already exists.');return}
    setCats(allCats().concat(n));i.value='';msg('');touch();render();MC=allCats();drawCatRows();
  }
  function renCat(i){
    if(!ADM)return;var old=MC[i],inp=layer.querySelector('[data-ncin="'+i+'"]'),n=inp?inp.value.trim():'';
    if(!old||!n)return msg('A category needs a name.');
    if(n===old)return;
    if(MC.some(function(x,j){return j!==i&&same(x,n)}))return msg('That name is already used.');
    setCats(MC.map(function(x,j){return j===i?n:x}));
    posts().forEach(function(p){if(same(p.c,old))p.c=n});
    if(same(CF,old))CF=n;
    msg('');touch();render();MC=allCats();drawCatRows();
  }
  function delCat(b){
    if(!ADM)return;
    if(!b.getAttribute('data-arm')){b.setAttribute('data-arm','1');b.textContent='Click again';return}
    var old=MC[+b.getAttribute('data-ncdel')];if(!old)return;
    setCats(MC.filter(function(x){return !same(x,old)}));
    posts().forEach(function(p){if(same(p.c,old))p.c=''});
    if(same(CF,old))CF='';
    msg('');touch();render();MC=allCats();drawCatRows();
  }

  function toast(t){var e=$('ntoast');if(!e){e=document.createElement('div');e.id='ntoast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2300)}

  function card(p,hero){
    var ex=(p.b||'').replace(/\s+/g,' ').trim(),max=hero?230:130;
    if(ex.length>max)ex=ex.slice(0,max).replace(/\s\S*$/,'')+'\u2026';
    var ims=p.im||[];
    return '<article class="ncard'+(hero?' hero':'')+'" tabindex="0" role="button" data-nid="'+p.id+'" aria-label="'+esc(p.t||'')+'">'+
      '<div class="nimg'+(ims.length?'':' noim')+'">'+(ims.length?'<img src="'+ims[0]+'" alt="" loading="lazy">':'<div class="nph">'+PH+'</div>')+
      (fresh(p)?'<span class="nnew">NEW</span>':'')+(ims.length>1?'<span class="ncnt">'+ims.length+' photos</span>':'')+
      (hero?'<div class="nov">'+meta(p)+'<h3>'+esc(p.t||'')+'</h3></div>':'')+'</div>'+
      '<div class="nbody">'+(hero?'':meta(p)+'<h3>'+esc(p.t||'')+'</h3>')+(ex?'<p>'+esc(ex)+'</p>':'')+'<span class="nmore">Read more &rarr;</span></div></article>';
  }
  function drawNews(force){
    if(CF&&!allCats().some(function(x){return same(x,CF)}))CF='';
    var sig=JSON.stringify(NEWS)+'|'+CF;if(!force&&sig===SIG&&nv.innerHTML)return;SIG=sig;
    var all=posts().sort(function(a,b){return (b.d||0)-(a.d||0)}),L=CF?all.filter(function(p){return same(p.c,CF)}):all,cl=allCats();
    var h='<div class="nhead"><div><h2>News</h2><p>The latest updates from Bot Fight</p></div><div class="nhb"><button type="button" class="ncm nadm" id="ncm">Categories</button><button type="button" class="npost nadm" id="nnew">+ New post</button></div></div>';
    if(cl.length)h+='<div class="ncats" role="group" aria-label="Categories"><button type="button" class="ncf'+(CF?'':' on')+'" data-ncf="">All <b>'+all.length+'</b></button>'+cl.map(function(n){var k=all.filter(function(p){return same(p.c,n)}).length;return '<button type="button" class="ncf'+(same(CF,n)?' on':'')+(k?'':' nadm')+'" style="--ch:'+hue(n)+'" data-ncf="'+esc(n)+'">'+esc(n)+' <b>'+k+'</b></button>'}).join('')+'</div>';
    if(!L.length)h+='<div class="nempty">'+PH+'<div>'+(CF?'No posts in this category yet.':'No news yet. Check back soon!')+'</div>'+(CF?'':'<div class="nadm" style="margin-top:6px">Press &ldquo;New post&rdquo; to write the first update.</div>')+'</div>';
    else h+='<div class="nfeed">'+L.map(function(p,i){return card(p,i===0)}).join('')+'</div>';
    nv.innerHTML=h;
  }
  function newsSync(){
    var latest=posts().reduce(function(m,p){return Math.max(m,p.d||0)},0);
    nb.classList.toggle('hasnew',latest>0&&Date.now()-latest<7*864e5);
    nb.setAttribute('aria-pressed',showNews?'true':'false');
    if(!showNews){nv.hidden=true;return}
    $('view').hidden=true;$('stats').hidden=true;$('ptsv').hidden=true;$('add').hidden=true;nv.hidden=false;
    [].forEach.call($('nav').children,function(b){b.setAttribute('aria-pressed','false')});
    $('sbtn').setAttribute('aria-pressed','false');$('pbtn').setAttribute('aria-pressed','false');
    drawNews();
  }
  var _r0=render;render=function(){var r=_r0.apply(this,arguments);newsSync();return r};

  /* modal layer + lightbox */
  var layer=document.createElement('div');layer.id='nlayer';layer.className='nback';layer.hidden=true;layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','News');document.body.appendChild(layer);
  var light=document.createElement('div');light.id='nlight';light.hidden=true;light.innerHTML='<button type="button" class="lc" aria-label="Close">\u00d7</button><button type="button" class="lp" aria-label="Previous">\u2039</button><img alt=""><button type="button" class="ln" aria-label="Next">\u203a</button>';document.body.appendChild(light);
  function openLayer(h){layer.innerHTML=h;layer.hidden=false;layer.scrollTop=0;document.body.style.overflow='hidden';var c=layer.querySelector('.nx,#net');if(c)c.focus({preventScroll:true})}
  function closeLayer(){layer.hidden=true;layer.innerHTML='';ED=null;CUR=null;document.body.style.overflow=''}
  function openLight(ims,i){if(!ims||!ims.length)return;LS=ims;LI=(i+ims.length)%ims.length;light.querySelector('img').src=LS[LI];var m=LS.length<2;light.querySelector('.lp').hidden=m;light.querySelector('.ln').hidden=m;light.hidden=false}
  function closeLight(){light.hidden=true;light.querySelector('img').removeAttribute('src')}
  light.addEventListener('click',function(e){var t=e.target;if(t.classList.contains('lp'))return openLight(LS,LI-1);if(t.classList.contains('ln'))return openLight(LS,LI+1);if(t.tagName!=='IMG')closeLight()});
  document.addEventListener('keydown',function(e){
    if(!light.hidden){if(e.key==='Escape')closeLight();else if(e.key==='ArrowLeft')openLight(LS,LI-1);else if(e.key==='ArrowRight')openLight(LS,LI+1);return}
    if(!layer.hidden&&e.key==='Escape')closeLayer();
    if(layer.hidden&&e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ncard'))openPost(e.target.getAttribute('data-nid'));
  });

  function openPost(id){
    var p=byId(id);if(!p)return;CUR=p;var ims=p.im||[];
    openLayer('<div class="nbox"><button type="button" class="nx" data-nclose aria-label="Close">\u00d7</button>'+
      (ims.length?'<div class="ndc"><img src="'+ims[0]+'" alt="" data-nli="0"></div>':'')+
      '<div class="ndb">'+meta(p)+'<h2>'+esc(p.t||'')+'</h2><div class="ntx">'+rich(p.b)+'</div>'+
      (ims.length>1?'<div class="ngal">'+ims.slice(1).map(function(s,i){return '<img src="'+s+'" alt="" data-nli="'+(i+1)+'">'}).join('')+'</div>':'')+
      '<div class="nadm nact"><button type="button" data-nedit="'+p.id+'">Edit post</button><button type="button" class="danger" data-ndel="'+p.id+'">Delete</button></div></div></div>');
  }
  function msg(t){var e=$('nems');if(e)e.textContent=t||''}
  function drawThumbs(){
    var g=$('neg');if(!g||!ED)return;
    g.innerHTML=ED.ims.map(function(s,i){return '<div class="nth"><img src="'+s+'" alt=""><button type="button" data-nrm="'+i+'" aria-label="Remove picture">\u00d7</button>'+(i?'<button type="button" class="ncv" data-ncv="'+i+'">Make cover</button>':'<span class="ncvl">Cover</span>')+'</div>'}).join('');
  }
  function openEdit(id){
    if(!ADM)return;var p=id?byId(id):null;
    ED={id:p?p.id:null,ims:p?(p.im||[]).slice():[],busy:0,c:p?(p.c||''):''};
    openLayer('<div class="nbox"><button type="button" class="nx" data-nclose aria-label="Close">\u00d7</button><div class="ned"><h3>'+(p?'Edit post':'New post')+'</h3>'+
      '<label>Title<input id="net" type="text" maxlength="100" placeholder="Title of the update" value="'+esc(p?p.t||'':'')+'"></label>'+
      '<label>Text<textarea id="neb" maxlength="5000" placeholder="Write the update here\u2026">'+esc(p?p.b||'':'')+'</textarea></label>'+
      '<div><b style="font-size:13px">Category</b> <span class="meta">optional, pick one or make a new one</span></div><div class="ncp" id="ncp"></div><input id="nec" type="text" maxlength="24" placeholder="New category name">'+
      '<div><b style="font-size:13px">Pictures</b> <span class="meta">The first picture is the cover. Drop images here or add them below.</span></div>'+
      '<div class="neg" id="neg"></div>'+
      '<label class="nadd">+ Add pictures<input id="nef" type="file" accept="image/*" multiple hidden></label>'+
      '<p class="meta" style="margin:0">The date and time are added automatically.</p><p id="nems" class="meta" role="status" style="margin:0"></p>'+
      '<div class="nact" style="margin-top:4px"><button type="button" id="nesave" class="npost">'+(p?'Save changes':'Publish post')+'</button><button type="button" id="necancel">Cancel</button></div></div></div>');
    drawThumbs();drawCatPick();
  }
  function shrink(file,maxDim,maxBytes){return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(url);
      var w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,maxDim/Math.max(w,h)),q=.86,out='';
      for(var k=0;k<12;k++){
        var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc)),c=document.createElement('canvas');c.width=cw;c.height=ch;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);
        out=c.toDataURL('image/jpeg',q);
        if(out.length*.75<=maxBytes)break;
        if(q>.6)q-=.1;else sc*=.82;
      }
      res(out)};
    im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}
  function addFiles(files){
    if(!ED)return;
    var db=hasDB(),max=db?4:8,dim=db?900:1600,bytes=db?55000:260000;
    var list=[].filter.call(files,function(f){return /^image\//.test(f.type)});
    if(!list.length)return;
    var room=max-ED.ims.length;
    if(room<=0){msg('One post can have up to '+max+' pictures.');return}
    var note='';if(list.length>room){list=list.slice(0,room);note=' Only '+max+' pictures fit in one post, so the extra ones were skipped.'}
    var my=ED;my.busy++;msg('Processing pictures\u2026');
    Promise.all(list.map(function(f){return shrink(f,dim,bytes).catch(function(){return null})})).then(function(r){
      r.forEach(function(x){if(x)my.ims.push(x)});my.busy--;
      if(ED===my){drawThumbs();msg((r.indexOf(null)>-1?'One picture could not be read. ':'')+note.trim())}
    });
  }
  function savePost(){
    if(!ADM||!ED)return;
    if(ED.busy){msg('Wait for the pictures to finish processing.');return}
    var t=$('net').value.trim(),b=$('neb').value.trim();
    if(!t){msg('Give the post a title.');$('net').focus();return}
    var p=ED.id?byId(ED.id):null;
    if(!p){p={id:newId(),d:Date.now()};NEWS.push(p)}
    var nc=($('nec').value||'').trim(),c=nc||ED.c||'';
    if(c){var ex=allCats().filter(function(x){return same(x,c)})[0];if(ex)c=ex;else setCats(allCats().concat(c))}
    p.t=t;p.b=b;p.c=c;p.im=ED.ims.slice();
    touch();closeLayer();render();
  }
  function delPost(b){
    if(!ADM)return;
    if(!b.getAttribute('data-arm')){b.setAttribute('data-arm','1');b.textContent='Click again to delete';return}
    var id=b.getAttribute('data-ndel');NEWS=NEWS.filter(function(x){return x.id!==id});touch();closeLayer();render();
  }
  layer.addEventListener('click',function(e){
    var t=e.target,b;if(!t.closest)return;
    if(t===layer||t.closest('[data-nclose]'))return closeLayer();
    if(b=t.closest('[data-nedit]'))return openEdit(b.getAttribute('data-nedit'));
    if(b=t.closest('[data-ndel]'))return delPost(b);
    if(b=t.closest('[data-nli]'))return openLight(CUR&&CUR.im,+b.getAttribute('data-nli'));
    if(b=t.closest('[data-nrm]')){if(ED){ED.ims.splice(+b.getAttribute('data-nrm'),1);drawThumbs()}return}
    if(b=t.closest('[data-ncv]')){if(ED){var i=+b.getAttribute('data-ncv'),x=ED.ims.splice(i,1)[0];ED.ims.unshift(x);drawThumbs()}return}
    if(b=t.closest('[data-ncpick]')){if(ED){var nm=b.getAttribute('data-ncpick');ED.c=same(ED.c,nm)?'':nm;var ni=$('nec');if(ni)ni.value='';drawCatPick()}return}
    if(b=t.closest('[data-ncren]'))return renCat(+b.getAttribute('data-ncren'));
    if(b=t.closest('[data-ncdel]'))return delCat(b);
    if(t.id==='ncadd')return addCat();
    if(t.id==='nesave')return savePost();
    if(t.id==='necancel')return closeLayer();
  });
  layer.addEventListener('input',function(e){if(ED&&e.target&&e.target.id==='nec'&&e.target.value){ED.c='';drawCatPick()}});
  layer.addEventListener('change',function(e){if(e.target&&e.target.id==='nef'){addFiles(e.target.files);e.target.value=''}});
  layer.addEventListener('dragover',function(e){if(ED)e.preventDefault()});
  layer.addEventListener('drop',function(e){if(ED&&e.dataTransfer){e.preventDefault();addFiles(e.dataTransfer.files)}});
  nv.addEventListener('click',function(e){
    var t=e.target;if(!t.closest)return;
    if(t.closest('#nnew'))return openEdit(null);
    if(t.closest('#ncm'))return openCats();
    var cf=t.closest('[data-ncf]');if(cf){CF=cf.getAttribute('data-ncf')||'';return drawNews(true)}
    var c=t.closest('.ncard');if(c)openPost(c.getAttribute('data-nid'));
  });

  /* header buttons */
  nb.onclick=function(){showNews=true;showStats=false;showPts=false;render();window.scrollTo(0,0)};
  eb.onclick=function(){toast('Events are coming soon')};
  ['nav','sbtn','pbtn'].forEach(function(i){var e=$(i);if(e)e.addEventListener('click',function(){showNews=false},true)});
  var lg=document.querySelector('.logo');if(lg)lg.addEventListener('click',function(){if(showNews){showNews=false;render()}},true);

  /* shared database (only used when the page runs with one) */
  window.newsJobs=function(){
    var jobs=[],cur={};if(!hasDB())return jobs;
    NEWS.forEach(function(p){cur[p.id]=JSON.stringify(p)});
    Object.keys(cur).forEach(function(k){if(NLAST[k]!==cur[k]){var v=cur[k];jobs.push(DB.collection('news').doc(k).set({j:v}).then(function(){NLAST[k]=v}))}});
    Object.keys(NLAST).forEach(function(k){if(!(k in cur))jobs.push(DB.collection('news').doc(k).delete().then(function(){delete NLAST[k]}))});
    return jobs;
  };
  window.newsListen=function(){
    DB.collection('news').onSnapshot(function(s){
      if(DT||DWR)return;
      if(!s.docs.length){if(NSEEN&&NEWS.length){NEWS=[];NLAST={};render()}return}
      NSEEN=true;var L=[],W={};
      s.docs.forEach(function(x){try{var j=x.data().j;L.push(JSON.parse(j));W[x.id]=j}catch(e){}});
      NLAST=W;if(JSON.stringify(NEWS)===JSON.stringify(L))return;
      NEWS=L;render();
    });
  };
  newsSync();
})();

/* ---- title page: choose a tierlist ---- */
(function(){
  var T=document.getElementById('title'),KEY='bt_list';
  var parts=['header','nav','#ticker','#rankbar','main'];
  function setInert(on){parts.forEach(function(s){var e=document.querySelector(s);if(e){if(on)e.setAttribute('inert','');else e.removeAttribute('inert')}})}
  function count(){var n=document.getElementById('bfcount');try{if(n&&typeof P!=='undefined'&&P.length)n.textContent='Tierlist \u00b7 '+P.length+' players'}catch(e){}}
  function show(){T.hidden=false;document.body.classList.add('on-title');setInert(true);try{sessionStorage.removeItem(KEY)}catch(e){}count();var b=document.getElementById('tc-bf');if(b)b.focus({preventScroll:true})}
  function hide(){T.hidden=true;document.body.classList.remove('on-title');setInert(false);try{sessionStorage.setItem(KEY,'bf')}catch(e){}window.scrollTo(0,0)}
  document.getElementById('tc-bf').onclick=hide;
    document.addEventListener('click',function(e){var l=e.target.closest&&e.target.closest('.logo');if(l&&T.hidden)show()});
  var oauth=location.hash.indexOf('access_token=')>-1,was=false;try{was=sessionStorage.getItem(KEY)==='bf'}catch(e){}
  if(oauth||was)hide();else show();
  setTimeout(count,700);setTimeout(count,2500);
})();
